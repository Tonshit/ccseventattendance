<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04081E" />
<title>Admin Login - CCS Admin Portal</title>

<style>
:root{
  --navy-950:#030712;
  --navy-900:#070E2E;
  --navy-800:#0A1440;
  --navy-700:#101C57;
  --navy-600:#182460;

  /* Primary Cyber Color Palette */
  --cyan-500:#0284C7;
  --cyan-400:#38BDF8;
  --cyan-300:#7DD3FC;
  --gold-300:#FDE047;
  --gold-400:#EAB308;
  --blue-400:#2563EB;

  --red-400:#F87171;
  --red-500:#EF4444;

  --paper:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; }
body{ overflow-x:hidden; overflow-y:auto; }

body{
  font-family:var(--font);
  color:#fff;
  background:var(--navy-950);
  background-image:
    radial-gradient(90% 70% at 50% 0%, rgba(56, 189, 248, 0.12) 0%, rgba(3, 7, 18, 0) 70%),
    radial-gradient(60% 50% at 50% 100%, rgba(16, 28, 87, 0.4) 0%, rgba(3, 7, 18, 0) 80%),
    linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:36px 20px;
  perspective: 1000px;
  min-height:100%;
}

#binary-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.22;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 80%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 80%);
}

.app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  transform-style: preserve-3d;
  animation: shrinkContainer 1.4s cubic-bezier(0.25, 1, 0.5, 1) both;
}

@keyframes shrinkContainer {
  0% { opacity: 0; transform: scale(0.9); }
  100% { opacity: 1; transform: scale(1); }
}

.anim-fade-down { animation: fadeDown 1s cubic-bezier(0.25, 1, 0.5, 1) 0.25s both; }
.anim-pop       { animation: logoShrink 1.3s cubic-bezier(0.25, 1, 0.5, 1) both; }
.anim-fade-up-1 { animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) 0.45s both; }
.anim-fade-up-2 { animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) 0.65s both; }
.anim-fade-up-3 { animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) 0.85s both; }

@keyframes logoShrink {
  0% { opacity: 0; transform: translateY(60px) scale(1.8); filter: blur(8px); }
  25% { opacity: 1; filter: blur(0); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); filter: blur(5px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); filter: blur(5px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 16px;
  background:rgba(10, 20, 64, 0.6);
  border:1px solid rgba(56, 189, 248, 0.25);
  border-radius:99px;
  font-size:11px;
  font-family: monospace, var(--font);
  font-weight:700;
  letter-spacing:.12em;
  color:var(--cyan-300);
  text-transform:uppercase;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  margin-bottom:18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 12px rgba(56, 189, 248, 0.1);
}
.badge-dot {
  width:7px;
  height:7px;
  background:var(--cyan-400);
  border-radius:50%;
  box-shadow:0 0 10px var(--cyan-400);
  animation:pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity:1; transform:scale(1); }
  50% { opacity:0.3; transform:scale(0.7); }
}

.logo-wrapper {
  position: relative;
  margin: 0 auto 18px;
  width: 118px;
  height: 118px;
  display: grid;
  place-items: center;
  z-index: 10;
}
.logo-ring-outer {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0%, var(--cyan-400) 45%, var(--gold-300) 70%, transparent 100%);
  animation: spinRing 7s linear infinite;
  opacity: 0.8;
}
.logo-ring-inner {
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: conic-gradient(from 180deg, transparent 0%, rgba(56, 189, 248, 0.8) 50%, transparent 100%);
  animation: spinRingReverse 4s linear infinite;
  opacity: 0.9;
}
@keyframes spinRing { 100% { transform: rotate(360deg); } }
@keyframes spinRingReverse { 100% { transform: rotate(-360deg); } }

.logo-frame{
  position: relative;
  z-index: 1;
  width:102px;
  height:102px;
  border-radius:50%;
  background:var(--navy-900);
  padding:6px;
  display:grid;
  place-items:center;
  box-shadow:0 0 0 2px rgba(56, 189, 248, 0.4), 0 0 30px rgba(56, 189, 248, 0.3), 0 14px 32px rgba(0,0,0,.7);
  overflow:hidden;
  animation:logoGlow 4s infinite alternate ease-in-out;
}
.logo-frame img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:50%; }
.logo-fallback{
  width:100%; height:100%; border-radius:50%;
  background:linear-gradient(150deg, var(--navy-700), var(--navy-900));
  color:var(--cyan-300);
  display:grid; place-items:center;
  font-size:11px; font-weight:800; letter-spacing:.14em; line-height:1.4; text-align:center;
}
@keyframes logoGlow {
  0% { box-shadow:0 0 0 2px rgba(56,189,248,0.3), 0 0 16px rgba(56,189,248,0.2), 0 14px 32px rgba(0,0,0,.6); }
  100% { box-shadow:0 0 0 2px rgba(56,189,248,0.6), 0 0 32px rgba(56,189,248,0.5), 0 18px 40px rgba(0,0,0,.8); }
}

.title-container { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; }
.title-line { display: flex; justify-content: center; flex-wrap: nowrap; }
.char-anim {
  display: inline-block;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: linear-gradient(135deg, #ffffff 30%, var(--cyan-300) 70%, var(--gold-300) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  opacity: 0;
  transform: translateY(15px) rotateX(-90deg);
  animation: charReveal 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards, shineText 8s linear infinite;
}
@keyframes charReveal { to { opacity: 1; transform: translateY(0) rotateX(0deg); } }
@keyframes shineText { to { background-position: 200% center; } }

.sub {
  font-size:12px; color:var(--cyan-400);
  font-family: monospace, var(--font); font-weight:600; letter-spacing:.1em;
  margin-top:6px; margin-bottom:20px; opacity: 0.85;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
}

.card {
  width:100%;
  background:rgba(7, 14, 46, 0.55);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(56, 189, 248, 0.18);
  border-radius:24px;
  padding:26px 22px;
  box-shadow:0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
  display:flex;
  flex-direction:column;
  gap:14px;
  transition: box-shadow 0.3s ease;
  transform-style: preserve-3d;
}

.field { display:flex; flex-direction:column; gap:7px; text-align:left; }
.field label {
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--cyan-300);
  font-family: monospace, var(--font);
}
.field-input-wrap { position:relative; display:flex; align-items:center; }
.field-input-wrap svg.icon {
  position:absolute; left:14px; width:16px; height:16px;
  stroke:var(--cyan-400); opacity:0.8; pointer-events:none;
}
.field input {
  width:100%;
  padding:13px 14px 13px 40px;
  border-radius:12px;
  border:1px solid rgba(56, 189, 248, 0.22);
  background:rgba(3, 7, 18, 0.55);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  letter-spacing:.02em;
  outline:none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
.field input::placeholder { color:rgba(255,255,255,0.32); }
.field input:focus {
  border-color: var(--cyan-400);
  background:rgba(3, 7, 18, 0.8);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15), 0 0 18px rgba(56, 189, 248, 0.2);
}
.toggle-pass {
  position:absolute; right:8px;
  width:30px; height:30px;
  display:grid; place-items:center;
  background:transparent; border:none;
  cursor:pointer; color:var(--cyan-300);
  opacity:0.75; transition: opacity 0.2s ease;
}
.toggle-pass:hover { opacity:1; }
.toggle-pass svg { width:17px; height:17px; }

.row-between { display:flex; align-items:center; justify-content:space-between; margin-top:-2px; }
.remember { display:flex; align-items:center; gap:7px; font-size:11.5px; color:rgba(255,255,255,0.55); }
.remember input[type="checkbox"]{
  appearance:none; -webkit-appearance:none;
  width:15px; height:15px; border-radius:4px;
  border:1px solid rgba(56, 189, 248, 0.35);
  background:rgba(3,7,18,0.6);
  cursor:pointer; position:relative;
  transition: all 0.2s ease;
}
.remember input[type="checkbox"]:checked {
  background: var(--cyan-500);
  border-color: var(--cyan-400);
}
.remember input[type="checkbox"]:checked::after {
  content:"";
  position:absolute; left:4px; top:1px;
  width:4px; height:8px;
  border:solid #030712;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.forgot { font-size:11.5px; color:var(--cyan-400); text-decoration:none; font-weight:700; }
.forgot:hover { text-decoration:underline; }

.error-box {
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:rgba(239, 68, 68, 0.1);
  border:1px solid rgba(239, 68, 68, 0.35);
  border-radius:10px;
  color:var(--red-400);
  font-size:12px;
  font-weight:600;
  text-align:left;
  animation: shakeIn 0.4s ease;
}
.error-box.show { display:flex; }
.error-box svg { width:15px; height:15px; flex-shrink:0; }
@keyframes shakeIn {
  0% { transform: translateX(0); opacity:0; }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); opacity:1; }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

.btn {
  --mouse-x: 50%; --mouse-y: 50%;
  position:relative;
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255, 255, 255, 0.3);
  font-family:inherit;
  font-size:13.5px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  overflow:hidden;
  transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, opacity 0.25s ease;
  margin-top:2px;
  text-decoration: none;
}
.btn-primary {
  background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #38bdf8 0%, #0284c7 100%);
  color:#030712;
  box-shadow:0 8px 26px rgba(2, 132, 199, 0.35);
}
.btn-primary:hover:not(:disabled) { transform:translateY(-2px) scale(1.01); box-shadow:0 12px 32px rgba(56, 189, 248, 0.5); }
.btn-primary:active:not(:disabled) { transform:translateY(1px) scale(0.99); }
.btn-primary:disabled { opacity:0.65; cursor:not-allowed; }
.btn svg { width:18px; height:18px; transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
.btn:hover:not(:disabled) svg { transform:translateX(5px); }

/* Secondary Sign Up Button */
.btn-secondary {
  background: rgba(16, 28, 87, 0.6);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: var(--cyan-300);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
}
.btn-secondary:hover {
  background: rgba(24, 36, 96, 0.85);
  border-color: var(--cyan-400);
  color: #fff;
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
}
.btn-secondary:active { transform: translateY(1px) scale(0.99); }

.spinner {
  width:16px; height:16px;
  border:2.5px solid rgba(3,7,18,0.25);
  border-top-color:#030712;
  border-radius:50%;
  animation: spin 0.7s linear infinite;
  display:none;
}
.btn.loading .spinner { display:inline-block; }
.btn.loading .btn-label,
.btn.loading svg.arrow { display:none; }
@keyframes spin { to { transform: rotate(360deg); } }

.divider { height:1px; background:rgba(56,189,248,0.14); margin:2px 0; }

.back-link {
  margin-top:6px;
  font-size:11.5px;
  color:rgba(255,255,255,0.45);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  justify-content:center;
  transition: color 0.2s ease;
}
.back-link:hover { color:var(--cyan-300); }
.back-link svg { width:13px; height:13px; }

.offline-pill {
  position: fixed; top: 12px; right: 12px; z-index: 100;
  font-family: monospace; font-size: 10px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; letter-spacing: .08em; text-transform: uppercase;
  background: rgba(10, 20, 64, 0.8);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: var(--cyan-300);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s ease;
}
.offline-pill.is-offline { border-color: rgba(234, 179, 8, 0.4); color: var(--gold-300); }
.offline-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.offline-pill.is-offline .offline-dot { background: var(--gold-400); box-shadow: 0 0 8px var(--gold-400); }

.foot { margin-top:22px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:.04em; line-height:1.6; }
.foot b { color:var(--cyan-300); font-weight:700; }
.foot code { font-family: monospace; color: var(--gold-300); opacity: 0.9; }

/* Security note */
.security-note {
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.45);
  background: rgba(10, 20, 64, 0.5);
  border: 1px solid rgba(56, 189, 248, 0.15);
  border-radius: 10px;
  padding: 8px 12px;
  text-align: left;
  line-height: 1.5;
  margin-top: -2px;
}
.security-note b { color: var(--cyan-300); }
</style>
</head>

  <span class="offline-dot" id="netDot"></span>
  <span id="netText">ONLINE</span>
</div>

<canvas id="binary-canvas"></canvas>

<div class="app" id="app">

  <div class="badge anim-fade-down">
    <span class="badge-dot"></span> <span id="binaryStatus">01000011 01000011 01010011</span>
  </div>

  <div class="logo-wrapper anim-pop">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>

        <input type="text" id="username" name="username" placeholder="e.g. ccsadmin" autocomplete="username" required />

    <div class="field">

      <div class="field-input-wrap">

          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" />
        Remember me

      <a href="#" class="forgot" id="forgotLink">Forgot password?</a>

    <button type="submit" class="btn btn-primary glow-btn" id="loginBtn">
      <span class="spinner"></span>
      <span class="btn-label">Sign In to Dashboard</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>

    <!-- ADDED SIGN UP BUTTON AS REQUESTED -->
    <a href="admin-signup.html" class="btn btn-secondary glow-btn" id="signUpBtn">
      <span class="btn-label">Create Admin Account</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>

<script>
(function(){
  // ================== LOCAL STORAGE AUTH CONFIG ==================
  const USERS_STORAGE_KEY = "ccs_admin_users";
  const SESSION_STORAGE_KEY = "ccs_admin_current_user";
  // ===============================================================

  // Helper to load registered users from localStorage
  function getAdminUsers() {
    try {
      const data = localStorage.getItem(USERS_STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (err) {
      return [];
    }
  }

  // Helper to save users to localStorage
  function saveAdminUsers(users) {
    localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
  }

  // NOTE: No default/seed admin is created. The first admin account is
  // created through admin-signup.html with a valid access code.

  // --- Network Connection Monitor ---
  const netStatus = document.getElementById('netStatus');
  const netText = document.getElementById('netText');
  function updateOnlineStatus() {
    if (navigator.onLine) {
      netStatus.classList.remove('is-offline');
      netText.textContent = "ONLINE";
    } else {
      netStatus.classList.add('is-offline');
      netText.textContent = "OFFLINE MODE";
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // --- Stacked Dynamic Entrance Animation for Title ---
  const titleLines = ["Admin", "Login"];
  const titleContainer = document.getElementById('animatedTitle');
  let globalCharIndex = 0;
  titleLines.forEach(lineText => {
    const lineDiv = document.createElement('div');
    lineDiv.className = 'title-line';
    lineText.split('').forEach(char => {
      const span = document.createElement('span');
      span.className = 'char-anim';
      span.innerHTML = char === ' ' ? '&nbsp;' : char;
      span.style.animationDelay = `${0.7 + globalCharIndex * 0.045}s, ${globalCharIndex * 0.1}s`;
      lineDiv.appendChild(span);
      globalCharIndex++;
    });
    titleContainer.appendChild(lineDiv);
  });

  // --- Logo Fallback & Dynamic Year ---
  const img = document.getElementById('schoolLogo');
  const fall = document.getElementById('logoFallback');
  img.onload = () => { img.hidden = false; fall.style.display = 'none'; };
  img.onerror = () => { img.hidden = true; fall.style.display = 'grid'; };
  document.getElementById('year').textContent = new Date().getFullYear();

  // --- Dynamic Binary Text Toggle for Status Pill ---
  const statusEl = document.getElementById('binaryStatus');
  const textOptions = ["SECURE LOGIN", "01000011 01000011 01010011", "LOCAL STORAGE AUTH"];
  let textIndex = 0;
  setInterval(() => {
    textIndex = (textIndex + 1) % textOptions.length;
    statusEl.style.opacity = '0';
    setTimeout(() => {
      statusEl.textContent = textOptions[textIndex];
      statusEl.style.opacity = '1';
    }, 200);
  }, 3500);

  // --- Live Binary Rain Matrix Canvas ---
  const canvas = document.getElementById('binary-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, columns, drops;
  const fontSize = 14;
  const chars = ['0', '1'];
  function initBinaryCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    columns = Math.floor(width / fontSize);
    drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -50));
  }
  function drawBinaryRain() {
    ctx.fillStyle = 'rgba(3, 7, 18, 0.16)';
    ctx.fillRect(0, 0, width, height);
    ctx.font = `${fontSize}px monospace`;
    for (let i = 0; i < drops.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = (i % 10 === 0) ? '#fde047' : '#38bdf8';
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  function animate() {
    drawBinaryRain();
    setTimeout(() => requestAnimationFrame(animate), 45);
  }
  window.addEventListener('resize', initBinaryCanvas);
  initBinaryCanvas();
  animate();

  // --- Glow Tracking for Button ---
  document.querySelectorAll('.glow-btn').forEach(btn => {
    btn.addEventListener('mousemove', e => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
      btn.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
    });
  });

  // --- Password Visibility Toggle ---
  const passInput = document.getElementById('password');
  const togglePass = document.getElementById('togglePass');
  const eyeIcon = document.getElementById('eyeIcon');
  togglePass.addEventListener('click', () => {
    const isHidden = passInput.type === 'password';
    passInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 4.22-5.94M9.9 4.24A9.99 9.99 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-2.29 3.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    togglePass.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  // --- Remembered Username ---
  const usernameInput = document.getElementById('username');
  const rememberBox = document.getElementById('remember');
  const savedUsername = localStorage.getItem('ccsAdminRememberedUsername');
  if (savedUsername) {
    usernameInput.value = savedUsername;
    rememberBox.checked = true;
  }

  // --- Error Box Helpers ---
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError() {
    errorBox.classList.remove('show');
  }

  // --- Forgot Password (real recovery page: ?mode=admin) ---
  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'forgot-password.html?mode=admin';
  });

  // --- Login Submit (Local Storage Auth) ---
  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const username = usernameInput.value.trim().toLowerCase();
    const password = passInput.value;

    if (!username || !password) {
      showError('Please enter both username and password.');
      return;
    }

    loginBtn.classList.add('loading');
    loginBtn.disabled = true;

    // Cloud sync: pull the latest admin list from Supabase so accounts
    // created on other devices can sign in here too.
    if (window.ccsSupabase && ccsSupabase.syncNow) {
      try { await ccsSupabase.syncNow(); } catch(err) {}
    }

    try {
      const users = getAdminUsers();
      const user = users.find(u => u.username === username);

      if (!user) {
        showError('Invalid username or password.');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        return;
      }

      // v3: verify against the salted hash (or legacy plaintext)
      const passOk = (window.ccsSupabase && ccsSupabase.verifyPassword)
        ? await ccsSupabase.verifyPassword(password, user.password || '')
        : (user.password === password);
      if (!passOk) {
        showError('Invalid username or password.');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        return;
      }

      // v3 upgrade: hash any legacy plaintext password and sync it
      if (user.password && typeof user.password === 'string' && window.ccsSupabase && ccsSupabase.hashPassword){
        user.password = await ccsSupabase.hashPassword(password);
        saveAdminUsers(users);
        if (ccsSupabase.pushAdmin) ccsSupabase.pushAdmin(user);
      }

      // Save session
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(user));
      try { sessionStorage.setItem('ccs_ev_admin_unlocked', '1'); } catch(e){}

      if (rememberBox.checked) {
        localStorage.setItem('ccsAdminRememberedUsername', username);
      } else {
        localStorage.removeItem('ccsAdminRememberedUsername');
      }

      // Cloud sync: keep this admin account available on every device
      if (window.ccsSupabase && ccsSupabase.pushAdmin) ccsSupabase.pushAdmin(user);

      // Redirect to admin dashboard
      window.location.href = 'event-admin.html';

    } catch (err) {
      showError('An error occurred during login.');
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
    }
  });
})();
</script>
