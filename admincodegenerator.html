<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04081E" />
<title>Admin Access Code - CCS IT Office</title>

<style>
:root{
  --navy-950:#030712;
  --navy-900:#070E2E;
  --navy-800:#0A1440;
  --navy-700:#101C57;
  --navy-600:#182460;

  --cyan-500:#0284C7;
  --cyan-400:#38BDF8;
  --cyan-300:#7DD3FC;
  --gold-300:#FDE047;
  --gold-400:#EAB308;
  --green-400:#4ADE80;

  --paper:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; }
body{
  font-family:var(--font);
  color:#fff;
  background:var(--navy-950);
  background-image:
    radial-gradient(90% 70% at 50% 0%, rgba(56, 189, 248, 0.14) 0%, rgba(3, 7, 18, 0) 70%),
    radial-gradient(60% 50% at 50% 100%, rgba(16, 28, 87, 0.4) 0%, rgba(3, 7, 18, 0) 80%),
    linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  min-height:100%;
}

#binary-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.22;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 80%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 80%);
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 18px;
}

/* Logo & Title */
.logo-wrapper {
  width: 76px; height: 76px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--cyan-400);
  display: grid; place-items: center;
  overflow: hidden;
  padding: 4px;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
}
.logo-wrapper img {
  width: 100%; height: 100%;
  object-fit: contain;
  border-radius: 50%;
  display: block;
}

.title-area h1 {
  font-size: 20px; font-weight: 800;
  letter-spacing: .06em; color: #fff;
  text-transform: uppercase;
}
.title-area p {
  font-size: 12px; color: var(--cyan-400);
  font-family: monospace; font-weight: 600;
  margin-top: 4px;
}

/* Simple Code Card */
.card {
  width: 100%;
  background: rgba(7, 14, 46, 0.65);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 24px;
  padding: 30px 24px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.code-label {
  font-family: monospace; font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .14em;
  color: var(--cyan-300);
}

.code-display {
  font-size: 32px; font-weight: 800;
  letter-spacing: .12em; color: #fff;
  font-family: monospace;
  background: rgba(3, 7, 18, 0.75);
  border: 2px dashed rgba(56, 189, 248, 0.4);
  border-radius: 16px;
  padding: 16px 20px;
  width: 100%;
  word-break: break-all;
  text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
  user-select: all;
  cursor: pointer;
  transition: all 0.25s ease;
}
.code-display:active {
  transform: scale(0.98);
  border-color: var(--gold-300);
}
.code-display.pulse {
  animation: codePulse 0.5s ease;
}
@keyframes codePulse {
  0% { transform: scale(0.95); opacity: 0.5; }
  100% { transform: scale(1); opacity: 1; }
}

.hint {
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.55);
  line-height: 1.5;
}

/* Button Stack */
.btn-row {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  font-family: inherit;
  font-size: 13.5px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 10px;
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn-primary {
  background: radial-gradient(circle at 50% 50%, #38bdf8 0%, #0284c7 100%);
  color: #030712;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 26px rgba(2, 132, 199, 0.35);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(56, 189, 248, 0.5);
}
.btn-primary:active { transform: translateY(1px); }

.btn-secondary {
  background: rgba(16, 28, 87, 0.6);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: var(--cyan-300);
}
.btn-secondary:hover {
  background: rgba(24, 36, 96, 0.85);
  border-color: var(--cyan-400);
  color: #fff;
  transform: translateY(-1px);
}
.btn-secondary:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; }

/* Navigation Back Link */
.back-link {
  margin-top: 4px;
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.45);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 0.2s ease;
}
.back-link:hover { color: var(--cyan-300); }
.back-link svg { width: 13px; height: 13px; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translate(-50%, 150%);
  background: var(--navy-800);
  border: 1px solid var(--cyan-400);
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  z-index: 100;
  display: flex; align-items: center; gap: 8px;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
.toast.show { transform: translate(-50%, 0); }
</style>
</head>

<div class="toast" id="toast">
  <svg style="width:16px;height:16px;color:var(--cyan-400);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="toastText">Code copied to clipboard!</span>
</div>

<script>
(function() {
  const CODES_STORAGE_KEY = "ccs_generated_access_codes";
  const DEFAULT_CODE = "CCS-ADMIN-2026";
  const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  function getCodes() {
    try {
      const data = localStorage.getItem(CODES_STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch(e) {
      return [];
    }
  }

  function saveCodes(codes) {
    localStorage.setItem(CODES_STORAGE_KEY, JSON.stringify(codes));
  }

  // Toast Helper
  const toastEl = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  let toastTimer = null;
  function showToast(msg) {
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 2200);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied "${text}" to clipboard!`);
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(`Copied "${text}" to clipboard!`);
  }

  // Display newest active code
  function renderActiveCode() {
    const codes = getCodes();
    const active = codes.find(c => c.status === 'active');
    const displayEl = document.getElementById('codeDisplay');
    displayEl.textContent = active ? active.code : DEFAULT_CODE;
  }

  // Copy buttons
  document.getElementById('copyBtn').addEventListener('click', () => {
    const val = document.getElementById('codeDisplay').textContent;
    copyToClipboard(val);
  });
  document.getElementById('codeDisplay').addEventListener('click', () => {
    const val = document.getElementById('codeDisplay').textContent;
    copyToClipboard(val);
  });

  // Generate New Code button
  document.getElementById('generateBtn').addEventListener('click', () => {
    let suffix = "";
    for (let i = 0; i < 4; i++) {
      suffix += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
    }
    const newCode = `CCS-ADM-2026-${suffix}`;

    const codes = getCodes();
    codes.unshift({
      id: 'code-' + Date.now(),
      code: newCode,
      status: 'active',
      created_at: new Date().toISOString()
    });

    saveCodes(codes);
    renderActiveCode();

    // Cloud sync: push the new access code so admins on other devices
    // can use it (e.g. for admin signup validation)
    if (window.ccsSupabase && ccsSupabase.pushAccessCode) ccsSupabase.pushAccessCode(codes[0]);

    const displayEl = document.getElementById('codeDisplay');
    displayEl.classList.remove('pulse');
    void displayEl.offsetWidth;
    displayEl.classList.add('pulse');

    showToast(`Generated new active code: ${newCode}`);
  });

  // Matrix binary rain canvas
  const canvas = document.getElementById('binary-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, columns, drops;
  const fontSize = 14;
  const chars = ['0', '1'];
  function initBinaryCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    columns = Math.floor(width / fontSize);
    drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -50));
  }
  function drawBinaryRain() {
    ctx.fillStyle = 'rgba(3, 7, 18, 0.16)';
    ctx.fillRect(0, 0, width, height);
    ctx.font = `${fontSize}px monospace`;
    for (let i = 0; i < drops.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = (i % 10 === 0) ? '#fde047' : '#38bdf8';
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  function animate() {
    drawBinaryRain();
    setTimeout(() => requestAnimationFrame(animate), 45);
  }
  window.addEventListener('resize', initBinaryCanvas);
  initBinaryCanvas();
  animate();

  renderActiveCode();
})();
</script>
